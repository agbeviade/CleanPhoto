workflows:
  android-release:
    name: Souvenir AI - Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.27.1
      java: 17
      vars:
        API_BASE_URL: "https://clean-photo.vercel.app"
        # SUPABASE_URL et SUPABASE_ANON_KEY sont a definir dans
        # Codemagic UI > Environment variables (Secured)
        # Si absents, l'app fonctionne en mode anonyme (sans cloud history).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generate Android scaffolding
        working_directory: mobile
        script: |
          flutter create --project-name souvenir_ai --org com.souvenirai --platforms=android .
          # Restaurer les fichiers customs (AndroidManifest, network_security_config)
          git checkout HEAD -- android/app/src/main/AndroidManifest.xml || true
          git checkout HEAD -- android/app/src/main/res/xml/network_security_config.xml || true

      - name: Bump Gradle, Kotlin & AGP versions
        working_directory: mobile
        script: |
          # 1. Gradle wrapper -> 8.9 (requis par AGP 8.7)
          sed -i.bak -E 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # 2. Kotlin 2.1.0 + AGP 8.7.0 dans settings.gradle
          sed -i.bak -E 's/id "org.jetbrains.kotlin.android" version "[^"]+" apply false/id "org.jetbrains.kotlin.android" version "2.1.0" apply false/' android/settings.gradle || true
          sed -i.bak -E 's/id "com.android.application" version "[^"]+" apply false/id "com.android.application" version "8.7.0" apply false/' android/settings.gradle || true
          # 3. Forcer NDK 27 dans app/build.gradle (requis par les plugins recents)
          if ! grep -q 'ndkVersion' android/app/build.gradle; then
            sed -i.bak -E 's/(android \{)/\1\n    ndkVersion "27.0.12077973"/' android/app/build.gradle
          else
            sed -i.bak -E 's/ndkVersion[ =]+"[^"]+"/ndkVersion "27.0.12077973"/' android/app/build.gradle
          fi
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== app/build.gradle (10 first lines of android block) ==="
          grep -A 10 '^android {' android/app/build.gradle | head -15

      - name: Get Flutter dependencies
        working_directory: mobile
        script: flutter pub get

      - name: Flutter analyze (non-blocking)
        working_directory: mobile
        script: flutter analyze --no-fatal-infos || true

      - name: Build APK release
        working_directory: mobile
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=${SUPABASE_URL:-} \
            --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}

    artifacts:
      - mobile/build/**/outputs/**/*.apk
      - mobile/build/**/outputs/**/mapping.txt

  # ===========================================================================
  # iOS DEBUG (NON-SIGNE) - Build de validation, AUCUN compte Apple requis
  # ===========================================================================
  # Genere un .app non signe pour verifier que la compilation iOS fonctionne.
  # Lance ce workflow en premier pour detecter les bugs Swift/Pod avant de
  # payer 99 USD/an le compte Apple Developer.
  ios-debug-unsigned:
    name: Souvenir AI - iOS Debug (unsigned validation build)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.27.1
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: "https://clean-photo.vercel.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: false  # Manuel uniquement (eviter de gaspiller les minutes)
    scripts:
      - name: Generate iOS scaffolding (idempotent)
        working_directory: mobile
        script: |
          # Cree ios/ s'il n'existe pas, sinon ne fait rien
          if [ ! -d "ios" ]; then
            flutter create --project-name souvenir_ai --org ci.cleanphoto --platforms=ios .
          fi
          ls -la ios/

      - name: Patch Info.plist (permissions iOS)
        working_directory: mobile
        script: |
          PLIST=ios/Runner/Info.plist
          # Permissions photo / camera (iOS 14+ exige des descriptions)
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Souvenir a besoin d acceder a vos photos pour les restaurer.'" $PLIST 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Souvenir a besoin d acceder a vos photos pour les restaurer.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Souvenir enregistre les photos restaurees dans votre galerie.'" $PLIST 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Souvenir enregistre les photos restaurees dans votre galerie.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Pour prendre une nouvelle photo a restaurer.'" $PLIST 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Pour prendre une nouvelle photo a restaurer.'" $PLIST
          # url_launcher : whitelist des schemes externes
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string https" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string http" $PLIST 2>/dev/null || true
          echo "=== Info.plist final ==="
          cat $PLIST

      - name: Bump iOS deployment target to 13.0
        working_directory: mobile/ios
        script: |
          # Certains plugins (flutter_secure_storage, image_picker) exigent iOS 13+
          sed -i.bak -E "s/^# platform :ios, '.*'/platform :ios, '13.0'/" Podfile || true
          sed -i.bak -E "s/^platform :ios, '.*'/platform :ios, '13.0'/" Podfile || true
          # Fallback : prepend si la ligne n'existe pas du tout
          if ! grep -q "^platform :ios" Podfile; then
            printf "platform :ios, '13.0'\n%s" "$(cat Podfile)" > Podfile.new
            mv Podfile.new Podfile
          fi
          head -5 Podfile

      - name: Get Flutter dependencies
        working_directory: mobile
        script: flutter pub get

      - name: Pod install
        working_directory: mobile/ios
        script: |
          pod repo update
          pod install --repo-update

      - name: Flutter analyze (non-blocking)
        working_directory: mobile
        script: flutter analyze --no-fatal-infos || true

      - name: Build iOS (no codesign)
        working_directory: mobile
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=${SUPABASE_URL:-} \
            --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}

    artifacts:
      - mobile/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  # ===========================================================================
