          sed -i.bak -E "s/^platform :ios, '.*'/platform :ios, '13.0'/" Podfile || true
          if ! grep -q "^platform :ios" Podfile; then
            printf "platform :ios, '13.0'\n%s" "$(cat Podfile)" > Podfile.new
            mv Podfile.new Podfile
          fi

      - name: Get Flutter dependencies
        working_directory: mobile
        script: flutter pub get

      - name: Pod install
        working_directory: mobile/ios
        script: |
          pod repo update
          pod install --repo-update

      # Decommenter quand le compte Apple Developer est configure :
