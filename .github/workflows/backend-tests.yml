name: Backend tests

on:
  push:
    paths:
      - 'api/**'
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps (LITE + tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests (LITE mode)
        env:
          PIPELINE_MODE: lite
        run: pytest -q backend/tests
