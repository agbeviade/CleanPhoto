name: souvenir_ai
description: "Souvenir AI - Restauration de photos anciennes par IA"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  image_gallery_saver_plus: ^3.0.5
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  supabase_flutter: ^2.5.6
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
